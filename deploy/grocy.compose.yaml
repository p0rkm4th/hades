name: hades-grocy

services:
  grocy:
    image: ${HADES_GROCY_IMAGE:?set HADES_GROCY_IMAGE from config/versions.env}
    container_name: hades-grocy
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    # Household state stays private until the owner-facing integration is ready.
    ports:
      - "127.0.0.1:7003:80"
    networks:
      - grocy-private
    volumes:
      - hades-grocy-data:/config

networks:
  grocy-private:
    name: hades-grocy-net
    driver: bridge

volumes:
  hades-grocy-data:
    name: hades-grocy-data

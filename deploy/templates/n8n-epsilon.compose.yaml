name: hades-epsilon

# Epsilon only: private, bounded runner for the HADES-owned
# ServerHealthWatch template. The image is supplied as an immutable digest by
# the operator; this file deliberately exposes no public interface.
services:
  n8n:
    image: ${HADES_N8N_IMAGE:?set an immutable HADES_N8N_IMAGE}
    container_name: hades-n8n-epsilon
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_METRICS: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: default
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "500"
      DB_SQLITE_POOL_SIZE: "2"
      GENERIC_TIMEZONE: America/Chicago
    volumes:
      - hades-n8n-epsilon-data:/home/node/.n8n
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/node/.cache:rw,nosuid,size=128m,mode=1777
    networks:
      - hades-epsilon
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:5678/healthz',r=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  hades-epsilon:
    name: hades-epsilon-net

volumes:
  hades-n8n-epsilon-data:
    name: hades-n8n-epsilon-data

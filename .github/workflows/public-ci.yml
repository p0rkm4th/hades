name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-safety-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Compile public Python adapters
        run: python -m py_compile hermes/sitecustomize.py integrations/agent-zero-mcp/server.py integrations/actual-finance-readonly/server.py

      - name: Check public JavaScript adapter
        run: node --check integrations/actual-finance-readonly/actual_client.js

      - name: Check memory intent boundary
        run: bash scripts/test-hades-memory-intent.sh

      - name: Check web intent boundary
        run: bash scripts/test-web-intent.sh

      - name: Check read-only response contracts
        run: python scripts/test-readonly-response-contracts.py

      - name: Check privileged capability boundary
        run: bash scripts/test-capability-boundary.sh

      - name: Check read-only configuration shapes
        run: bash scripts/test-readonly-config-shapes.sh

      - name: Check recovery artifact safety
        run: bash scripts/test-recovery-artifact-safety.sh

      - name: Check workflow action pinning
        run: bash scripts/test-workflow-pinning.sh

      - name: Check public history
        run: bash scripts/public-history-audit.sh

      - name: Validate shell scripts
        run: bash -n scripts/*.sh webui/entrypoint.sh

      - name: Validate deployment compose files
        run: |
          export HADES_IDENTITY_SECRETS_DIR="$RUNNER_TEMP/hades-identity-secrets"
          mkdir -p "$HADES_IDENTITY_SECRETS_DIR"
          for compose_file in deploy/*.compose.yaml; do
            docker compose -f "$compose_file" config --quiet
          done

name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-safety-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile public Python adapters
        run: python -m py_compile hermes/sitecustomize.py integrations/agent-zero-mcp/server.py

      - name: Run secret-free regression checks
        run: |
          bash scripts/test-hades-memory-intent.sh
          bash scripts/test-capability-boundary.sh
          bash scripts/test-readonly-config-shapes.sh
          bash scripts/public-history-audit.sh

      - name: Validate shell scripts
        run: bash -n scripts/*.sh webui/entrypoint.sh

      - name: Validate deployment compose files
        run: |
          export HADES_IDENTITY_SECRETS_DIR="$RUNNER_TEMP/hades-identity-secrets"
          mkdir -p "$HADES_IDENTITY_SECRETS_DIR"
          for compose_file in deploy/*.compose.yaml; do
            docker compose -f "$compose_file" config --quiet
          done
